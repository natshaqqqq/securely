<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Securely cybersecurity learning dashboard with progress, points, and module tracking." />
    <meta property="og:title" content="Securely Dashboard" />
    <meta property="og:description" content="Track your cybersecurity learning progress with Securely." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Securely Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard">SECURELY</a>

        <nav class="navigation">
          <section class="nav-group" aria-labelledby="overview-label">
            <h2 class="nav-label" id="overview-label">OVERVIEW</h2>
            <a class="nav-link active" href="#dashboard" aria-current="page">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9M9 19v-5h6v5"/></svg>
              <span>Dashboard</span>
            </a>
            <a class="nav-link" href="#lesson">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7.5h6l2 2h8v9H4z"/><path d="M4 7.5V5h6l2 2"/></svg>
              <span>Lesson</span>
            </a>
            <a class="nav-link" href="#task">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h3M13 13h3"/></svg>
              <span>Task</span>
            </a>
          </section>

          <section class="nav-group" aria-labelledby="settings-label">
            <h2 class="nav-label" id="settings-label">SETTINGS</h2>
            <a class="nav-link" href="#profile">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3"/><path d="M6.5 19c.7-3.2 2.5-5 5.5-5s4.8 1.8 5.5 5"/><circle cx="12" cy="12" r="9"/></svg>
              <span>Profile</span>
            </a>
            <a class="nav-link" href="#settings">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1A7 7 0 0 0 14.4 5L14 2.5h-4L9.6 5a7 7 0 0 0-2.1 1.9l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1A7 7 0 0 0 9.6 19l.4 2.5h4l.4-2.5a7 7 0 0 0 2.1-1.9l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
              <span>Settings</span>
            </a>
          </section>
        </nav>

        <button class="logout-button" type="button">Logout</button>
      </aside>

      <header class="topbar">
        <button class="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="page-title">Dashboard</h1>
      </header>

      <main class="main-content" id="dashboard">
        <section class="welcome-panel" aria-labelledby="welcome-title">
          <h2 class="welcome-title" id="welcome-title">Welcome Back, User!</h2>
          <p class="welcome-copy">Continue your cybersecurity journey</p>

          <div class="stats-grid">
            <article class="stat-card">
              <svg class="stat-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h4v4a5 5 0 0 1-5 5h-.3A6 6 0 0 1 13 16.7V19h4v2H7v-2h4v-2.3A6 6 0 0 1 8.3 14H8a5 5 0 0 1-5-5V5h4V3Zm0 4H5v2a3 3 0 0 0 2.4 2.9A8 8 0 0 1 7 9.5V7Zm10 4.9A3 3 0 0 0 19 9V7h-2v2.5c0 .8-.1 1.6-.4 2.4h.4Z"/></svg>
              <div class="stat-content"><span class="stat-label">Level</span><span class="stat-value">2</span></div>
            </article>
            <article class="stat-card">
              <svg class="stat-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.7 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.3l6.2-.9L12 2.7Z"/></svg>
              <div class="stat-content"><span class="stat-label">Points</span><span class="stat-value">200</span></div>
            </article>
            <article class="stat-card">
              <svg class="stat-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="3" width="16" height="18" rx="2"/><rect x="8" y="7" width="8" height="2" fill="white"/><rect x="8" y="11" width="5" height="2" fill="white"/></svg>
              <div class="stat-content"><span class="stat-label">Modules</span><span class="stat-value">1/15</span></div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <div class="sidebar-backdrop" aria-hidden="true"></div>
    <script src="/script.js" defer></script>
  </body>
</html>
