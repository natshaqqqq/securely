<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Securely | Register</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <meta name="description" content="Create your Securely account to start your cybersecurity training." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="register-page">
        <a class="back-button" href="index.html" aria-label="Back to home">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>

        <!-- Intro OUTSIDE the container -->
        <div class="register-intro">
            <div class="brand">
                <h1>SECURELY</h1>
            </div>

            <h2>Register Your Account</h2>
            <p class="desc">Start your cybersecurity training</p>
        </div>

        <!-- Container starts at the steps -->
        <div class="register-container">

            <ul class="steps-indicator">
                <li class="step active">
                    <span class="step-number">1</span>
                    <span class="step-label">Register</span>
                </li>
                <li class="step-line"></li>
                <li class="step">
                    <span class="step-number">2</span>
                    <span class="step-label">Verify</span>
                </li>
                <li class="step-line"></li>
                <li class="step">
                    <span class="step-number">3</span>
                    <span class="step-label">Complete</span>
                </li>
            </ul>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required />
                    <div class="error-message" id="nameError">Please enter your name</div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required />
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <input type="password" id="password" placeholder="Create a strong password" required />
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                    <div class="error-message" id="passwordError">Password must be at least 8 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-icon">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                        <i class="fas fa-eye" id="toggleConfirmPassword"></i>
                    </div>
                    <div class="error-message" id="confirmPasswordError">Passwords do not match</div>
                </div>

                <button type="submit" class="auth-btn" id="registerBtn">Continue</button>
            </form>

            <div id="registerMessage"></div>

            <p class="auth-link">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
