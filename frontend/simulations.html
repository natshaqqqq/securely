<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Securely | Simulations</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="training-page">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h1>SECURELY</h1>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="nav-section-title">OVERVIEW</span>
                    <ul>
                        <li>
                            <a href="dashboard.html" id="navDashboard">
                                <i class="fas fa-th-large"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="modules.html" id="navLesson">
                                <i class="fas fa-book-open"></i>
                                <span>Modules</span>
                            </a>
                        </li>
                        <li class="active">
                            <a href="simulations.html" id="navSimulations">
                                <i class="fas fa-shield-virus"></i>
                                <span>Simulations</span>
                            </a>
                        </li>
                        <li>
                            <a href="resources.html" id="navResources">
                                <i class="fas fa-bookmark"></i>
                                <span>Resources</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="#" id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>Simulations</h2>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <span class="user-name" id="userName">User</span>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>
                </div>
            </header>

            <div class="simulations-page">

                <div class="simulations-hero">
                    <h1>SIMULATIONS</h1>
                    <p>Practice real scenarios. Spot the phish, test your passwords, analyse suspicious messages, and inspect URLs.</p>
                </div>

                <div id="simLoading" class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading simulations...
                </div>

                <div id="simError" class="empty-state error" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Could not load simulations</h3>
                    <p id="simErrorText"></p>
                    <button onclick="location.reload()" class="retry-btn">Retry</button>
                </div>

                <div id="simGrid" class="sim-hub-grid" style="display:none;"></div>

            </div>
        </main>
    </div>

    <script src="js/simulations.js"></script>
</body>
</html>
